[build-system]
requires = ["setuptools >= 77", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "seecr-stdlib"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Small Python utilities: attribute-access dicts, JSON configuration, timezone-aware time helpers and date formatting"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["utilities", "dict", "config", "json", "datetime", "timezone", "date formatting"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "pytest >= 9.0.1, < 10",
    "python-dateutil >= 2.9.0, < 3"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/seecr/seecr-stdlib"
Source = "https://github.com/seecr/seecr-stdlib"
Issues = "https://github.com/seecr/seecr-stdlib/issues"

[tool.setuptools_scm]
version_file = "seecr_stdlib/_version.py"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["seecr_stdlib*"]

[tool.isort]
profile = "black"

